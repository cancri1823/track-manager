<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 解決本機開啟時圖資伺服器阻擋 Referer 的問題 -->
  <meta name="referrer" content="no-referrer-when-downgrade">
  <title>GPX / KML / KMZ 路徑管理系統</title>
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 Leaflet 地圖庫 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- 載入 JSZip (解壓縮 KMZ 用) 與 toGeoJSON (解析 KML/GPX 用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>
  <style>
    body, html { height: 100vh; width: 100vw; margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    /* 強制鎖定地圖絕對定位填滿右側容器，解決 Tailwind 非同步載入時高度為 0 的問題 */
    #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; height: 100%; width: 100%; z-index: 1; background-color: #e2e8f0; }
    .active-track-card { border-left: 6px solid #2563eb !important; background-color: #eff6ff !important; }
    /* 自訂捲軸 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* 浮動可放大縮小與拖曳之面板設定 */
    #editPanel {
      resize: both;
      overflow: hidden;
      min-width: 300px;
      min-height: 44px;
      max-width: 92vw;
      max-height: 94vh;
    }
    /* 地圖路徑 Popup 浮動視窗支援拖拉縮放 */
    .leaflet-popup-content {
      margin: 10px 12px;
    }
    .resizable-popup {
      resize: both;
      overflow: auto;
      min-width: 210px;
      min-height: 80px;
      max-width: 480px;
      max-height: 380px;
    }
  </style>
</head>
<body class="flex h-screen overflow-hidden bg-slate-100">

  <!-- 左側控制與清單面板 -->
  <div id="leftSidebar" class="w-[360px] shrink-0 h-full flex flex-col bg-white shadow-xl z-10 border-r border-slate-200 transition-all duration-300">
    
    <!-- 頂部標題與匯入按鈕 -->
    <div class="p-3 bg-slate-800 text-white">
      <div class="flex justify-between items-center mb-2">
        <h1 class="text-base font-bold tracking-wide flex items-center gap-1.5">
          <span>🗺️</span> 軌跡路徑管理系統
        </h1>
        <span id="syncStatus" class="text-[11px] px-2 py-0.5 rounded bg-slate-700 text-slate-300">尚未連接資料夾</span>
      </div>
      <div class="grid grid-cols-3 gap-1">
        <button id="btnConnectFolder" class="bg-blue-600 hover:bg-blue-500 text-white py-1.5 px-1.5 rounded text-xs font-medium transition flex items-center justify-center gap-0.5 shadow" title="連接電腦資料夾同步">
          📂 連接
        </button>
        <button id="btnRefreshFolder" class="bg-emerald-600 hover:bg-emerald-500 text-white py-1.5 px-1.5 rounded text-xs font-medium transition flex items-center justify-center gap-0.5 shadow" title="重新讀取電腦資料夾">
          🔄 重新整理
        </button>
        <label class="bg-slate-700 hover:bg-slate-600 text-white py-1.5 px-1.5 rounded text-xs font-medium transition flex items-center justify-center gap-0.5 cursor-pointer shadow" title="單純匯入檔案">
          📄 匯入
          <input type="file" id="fileInput" multiple accept=".kml,.kmz,.gpx" class="hidden">
        </label>
      </div>
    </div>

    <!-- 篩選區塊 -->
    <div class="p-2.5 bg-slate-50 border-b border-slate-200 space-y-1.5 text-xs">
      <div class="flex items-center justify-between font-semibold text-slate-700">
        <span>🔍 檔名、分類與條件篩選</span>
        <button id="btnResetFilter" class="text-blue-600 hover:underline">清除篩選</button>
      </div>
      
      <!-- 分類與年份篩選 -->
      <div class="grid grid-cols-2 gap-1.5">
        <select id="filterCategory" class="border border-slate-300 rounded p-1 bg-white font-medium text-slate-700">
          <option value="">所有分類</option>
          <option value="主題地圖">📌 主題地圖</option>
          <option value="台灣旅遊地圖">🇹🇼 台灣旅遊地圖</option>
          <option value="出國旅遊地圖">✈️ 出國旅遊地圖</option>
          <option value="參考地圖">📖 參考地圖</option>
          <option value="生活地圖">☕ 生活地圖</option>
          <option value="其他自訂分類">🏷️ 其他自訂分類</option>
        </select>
        <select id="filterYear" class="border border-slate-300 rounded p-1 bg-white">
          <option value="">所有年份</option>
        </select>
      </div>

      <!-- 檔名關鍵字搜尋 (支援8碼日期如20121201搜尋) -->
      <div>
        <input type="text" id="filterLocation" placeholder="輸入檔名或8碼日期(例如 20121201)..." class="border border-slate-300 rounded p-1 w-full bg-white">
      </div>

      <!-- 全選顯示控制 -->
      <div class="flex items-center justify-between pt-1.5 border-t border-slate-200 text-slate-600">
        <label class="flex items-center gap-1.5 cursor-pointer font-medium">
          <input type="checkbox" id="toggleAllVisible" checked class="rounded text-blue-600">
          <span>全選 / 取消顯示篩選結果</span>
        </label>
        <span id="trackCount" class="text-slate-500">共 0 筆路徑</span>
      </div>

      <!-- 勾選檔案批次刪除與地圖組合控制列 -->
      <div class="flex items-center justify-between pt-1.5 border-t border-slate-200 text-slate-600">
        <label class="flex items-center gap-1.5 cursor-pointer font-medium text-red-700">
          <input type="checkbox" id="toggleAllDeleteSelect" class="rounded text-red-600 cursor-pointer">
          <span>全選 / 取消待處理檔案</span>
        </label>
        <div class="flex gap-1">
          <button id="btnMergeTracks" type="button" disabled class="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-300 disabled:text-slate-500 text-white px-2 py-1 rounded text-xs font-semibold transition shadow-sm" title="將勾選的多個地圖檔案組合成一個新的 GPX 檔案並下載">
            🧩 地圖組合 (0)
          </button>
          <button id="btnBatchDelete" type="button" disabled class="bg-red-600 hover:bg-red-500 disabled:bg-slate-300 disabled:text-slate-500 text-white px-2 py-1 rounded text-xs font-semibold transition shadow-sm">
            🗑️ 刪除 (0)
          </button>
        </div>
      </div>
    </div>

    <!-- 路徑檔案列表 -->
    <div id="trackList" class="flex-1 overflow-y-auto p-2.5 space-y-2">
      <div class="text-center text-slate-400 mt-12 text-sm">
        請點擊上方按鈕連接資料夾或匯入 .gpx, .kml, .kmz 檔案
      </div>
    </div>

  </div>

  <!-- 右側地圖與浮動編輯面板 -->
  <div class="flex-1 relative h-full">
    <!-- 左上角：收合/展開左側清單按鈕，讓地圖可100%滿版顯示 -->
    <button id="btnToggleSidebar" type="button" class="absolute top-3 left-3 z-[1000] bg-white hover:bg-slate-100 text-slate-800 border border-slate-300 px-2.5 py-1.5 rounded-md shadow-md text-xs font-bold flex items-center gap-1 transition" title="收合或展開左側清單以放大地圖">
      <span>◀ 收合清單</span>
    </button>

    <div id="map"></div>

    <!-- 新增地點模式提示列 -->
    <div id="addWaypointBanner" class="hidden absolute top-4 left-1/2 -translate-x-1/2 z-[1000] bg-amber-500 text-white px-5 py-2.5 rounded-full shadow-lg font-bold text-sm flex items-center gap-3 animate-bounce">
      <span>📍 請直接在地圖上點擊要新增地點的位置</span>
      <button id="btnCancelWaypoint" class="bg-amber-700 hover:bg-amber-800 px-2.5 py-0.5 rounded-full text-xs">取消</button>
    </div>

    <!-- 右上角：點選路徑顯示出的浮動資訊與編輯面板 -->
    <div id="editPanel" class="hidden absolute top-3 right-3 z-[1000] w-[360px] bg-white/95 backdrop-blur rounded-lg shadow-2xl border border-slate-300 flex flex-col">
      <!-- 頂部標題列 (可按住拖曳移動位置) -->
      <div id="editPanelHeader" class="p-2.5 bg-slate-800 text-white rounded-t-lg flex justify-between items-center cursor-move select-none shrink-0" title="按住此標題列可自由拖曳浮動視窗位置">
        <h3 class="font-bold text-xs flex items-center gap-1.5 truncate pr-2">
          <span>✏️</span> <span id="editPanelTitleText">路徑與檔案資訊 (可拖曳/縮放)</span>
        </h3>
        <div class="flex items-center gap-1 shrink-0">
          <button id="btnMinEdit" type="button" class="text-slate-300 hover:text-white px-1.5 py-0.5 rounded hover:bg-slate-700 text-xs font-bold" title="縮小 / 展開內容">🗕</button>
          <button id="btnMaxEdit" type="button" class="text-slate-300 hover:text-white px-1.5 py-0.5 rounded hover:bg-slate-700 text-xs font-bold" title="放大 / 還原視窗">🗖</button>
          <button id="btnCloseEdit" type="button" class="text-slate-300 hover:text-red-400 px-1.5 py-0.5 rounded hover:bg-slate-700 text-base leading-none" title="關閉視窗">&times;</button>
        </div>
      </div>

      <!-- 面板主要內容區 -->
      <div id="editPanelBody" class="p-3.5 overflow-y-auto space-y-2.5 text-xs flex-1 max-h-[75vh]">
        <!-- 檔案名稱修改 -->
        <div>
          <label class="block font-semibold text-slate-700 mb-1">檔案名稱 (可同步修改硬碟檔名)</label>
          <div class="flex gap-1">
            <input type="text" id="editFileName" class="border border-slate-300 rounded p-1.5 flex-1 font-medium text-slate-800">
            <span id="editFileExt" class="bg-slate-100 border border-slate-300 rounded px-2 py-1.5 text-slate-500 font-mono"></span>
          </div>
        </div>

        <!-- 檔案分類選擇與自訂輸入 -->
        <div class="space-y-1.5">
          <label class="block font-semibold text-slate-700">路徑分類</label>
          <div class="grid grid-cols-2 gap-2">
            <select id="editCategorySelect" class="border border-slate-300 rounded p-1.5 bg-white font-medium text-slate-800">
              <option value="主題地圖">📌 主題地圖</option>
              <option value="台灣旅遊地圖">🇹🇼 台灣旅遊地圖</option>
              <option value="出國旅遊地圖">✈️ 出國旅遊地圖</option>
              <option value="參考地圖">📖 參考地圖</option>
              <option value="生活地圖">☕ 生活地圖</option>
              <option value="其他自訂">🏷️ 其他自訂...</option>
            </select>
            <input type="text" id="editCategoryCustom" placeholder="輸入自訂分類名稱..." class="border border-slate-300 rounded p-1.5 bg-white font-medium text-slate-800 hidden">
          </div>
        </div>

        <!-- 紀錄日期 -->
        <div>
          <label class="block font-semibold text-slate-700 mb-1">紀錄日期</label>
          <input type="date" id="editDate" class="border border-slate-300 rounded p-1.5 w-full">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">地點 / 路線區域</label>
          <input type="text" id="editLocation" placeholder="匯入時自動抓取，亦可手動修改..." class="border border-slate-300 rounded p-1.5 w-full">
        </div>

        <!-- 距離與高程數據區 -->
        <div class="bg-slate-50 p-2.5 rounded border border-slate-200 space-y-1.5 text-[11px]">
          <div class="font-bold text-slate-700 border-b pb-1">📊 路線軌跡數據與中繼資料</div>
          <div class="grid grid-cols-2 gap-2 pt-1">
            <div>📏 <span class="font-semibold text-slate-600">總距離：</span><span id="metaDistance" class="text-slate-800 font-bold">0.00 km</span></div>
            <div>⛰️ <span class="font-semibold text-slate-600">總爬升：</span><span id="metaElevation" class="text-slate-800 font-bold">0 m</span></div>
          </div>
          <div id="metaAuthorContainer" class="hidden pt-1">👤 <span class="font-semibold text-slate-600">作者：</span><span id="metaAuthor" class="text-slate-800"></span></div>
          <div id="metaLinkContainer" class="hidden">🔗 <span class="font-semibold text-slate-600">相關連結：</span><a id="metaLink" href="#" target="_blank" class="text-blue-600 hover:underline break-all"></a></div>
        </div>

        <!-- 顏色與線條粗細 -->
        <div class="grid grid-cols-2 gap-2 pt-1">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">路徑顏色</label>
            <div class="flex items-center gap-2">
              <input type="color" id="editColor" class="h-8 w-14 cursor-pointer rounded border border-slate-300">
              <span id="editColorHex" class="text-slate-500 font-mono">#FF0000</span>
            </div>
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">線條粗細：<span id="weightVal">4</span> px</label>
            <input type="range" id="editWeight" min="1" max="12" value="4" class="w-full mt-1.5 cursor-pointer">
          </div>
        </div>

        <!-- 自訂地點 (Waypoints) 管理 -->
        <div class="pt-2 border-t border-slate-200">
          <div class="flex justify-between items-center mb-2">
            <label class="font-semibold text-slate-700">📍 新增與管理標記地點</label>
            <button id="btnStartAddWaypoint" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded text-xs font-medium transition shadow-sm">
              + 在地圖上點選新增
            </button>
          </div>
          <div id="waypointList" class="space-y-1.5 max-h-36 overflow-y-auto pr-1">
            <!-- 動態渲染自訂地點 -->
          </div>
        </div>
      </div>

      <!-- 底部儲存與刪除按鈕 -->
      <div id="editPanelFooter" class="p-2.5 bg-slate-50 rounded-b-lg border-t border-slate-200 flex justify-between items-center gap-2 shrink-0">
        <button id="btnDeleteTrack" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 py-1.5 px-3 rounded text-xs font-semibold transition">
          🗑️ 刪除檔案
        </button>
        <div class="flex gap-1.5 mr-2">
          <button id="btnZoomToTrack" class="bg-slate-200 hover:bg-slate-300 text-slate-700 py-1.5 px-2.5 rounded text-xs font-semibold transition">
            🎯 縮放至路徑
          </button>
          <button id="btnSaveTrack" class="bg-blue-600 hover:bg-blue-500 text-white py-1.5 px-3.5 rounded text-xs font-semibold transition shadow">
            💾 儲存修改
          </button>
        </div>
      </div>
    </div>
  </div>

<script>
  // ======================= 全域狀態與變數 =======================
  let map;
  let directoryHandle = null; 
  let tracks = [];            
  let selectedTrackId = null; 
  let selectedForDeleteIds = new Set(); 
  let isAddingWaypoint = false;
  let geocodeQueue = [];      
  let isGeocoding = false;
  let isEditMinimized = false;
  let isEditMaximized = false;
  const METADATA_FILENAME = '_tracks_metadata.json';
  const DEFAULT_COLORS = ['#ef4444', '#f97316', '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899'];

  // ======================= 初始化地圖 =======================
  function initMap() {
    map = L.map('map', { zoomControl: false }).setView([23.6, 120.9], 8);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    
    const googleStreets = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '© Google Maps'
    }).addTo(map);

    const googleTerrain = L.tileLayer('https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '© Google Terrain'
    });

    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    });

    const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17,
      attribution: '© OpenTopoMap'
    });

    L.control.layers({
      "標準街道圖 (Google)": googleStreets,
      "等高線地形圖 (Google)": googleTerrain,
      "OpenStreetMap": osm,
      "OpenTopoMap": topo
    }, null, { position: 'bottomleft' }).addTo(map);

    setTimeout(() => { map.invalidateSize(); }, 150);
    setTimeout(() => { map.invalidateSize(); }, 500);
    window.addEventListener('resize', () => { map.invalidateSize(); });

    map.on('click', (e) => {
      if (!isAddingWaypoint || !selectedTrackId) return;
      const track = tracks.find(t => t.id === selectedTrackId);
      if (!track) return;

      const title = prompt('請輸入此地點的名稱：', '新標記地點');
      if (title !== null && title.trim() !== '') {
        const desc = prompt('請輸入地點備註（可留空）：', '');
        const wp = {
          id: 'wp_' + Date.now(),
          name: title.trim(),
          desc: desc ? desc.trim() : '',
          lat: e.latlng.lat,
          lng: e.latlng.lng
        };
        track.waypoints.push(wp);
        renderMapLayers(track);
        renderWaypointList(track);
        saveMetadataToStorage();
      }
      exitAddWaypointMode();
    });

    initFloatingPanelControls();
  }

  // ======================= 左側欄收合與浮動面板拖曳 / 放大縮小控制 =======================
  function initFloatingPanelControls() {
    const sidebar = document.getElementById('leftSidebar');
    const btnToggleSidebar = document.getElementById('btnToggleSidebar');
    let sidebarOpen = true;
    btnToggleSidebar.addEventListener('click', () => {
      sidebarOpen = !sidebarOpen;
      if (sidebarOpen) {
        sidebar.classList.remove('hidden');
        btnToggleSidebar.innerHTML = '<span>◀ 收合清單</span>';
      } else {
        sidebar.classList.add('hidden');
        btnToggleSidebar.innerHTML = '<span>▶ 展開清單</span>';
      }
      setTimeout(() => { if (map) map.invalidateSize(); }, 310);
    });

    const panel = document.getElementById('editPanel');
    const header = document.getElementById('editPanelHeader');
    let isDragging = false;
    let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

    header.addEventListener('mousedown', (e) => {
      if (e.target.closest('button')) return;
      isDragging = true;
      const rect = panel.getBoundingClientRect();
      const parentRect = panel.parentElement.getBoundingClientRect();
      panel.style.right = 'auto';
      initialLeft = rect.left - parentRect.left;
      initialTop = rect.top - parentRect.top;
      panel.style.left = initialLeft + 'px';
      panel.style.top = initialTop + 'px';
      startX = e.clientX;
      startY = e.clientY;
      document.body.style.userSelect = 'none';
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      const parentRect = panel.parentElement.getBoundingClientRect();
      let newLeft = Math.max(0, Math.min(parentRect.width - 80, initialLeft + dx));
      let newTop = Math.max(0, Math.min(parentRect.height - 44, initialTop + dy));
      panel.style.left = newLeft + 'px';
      panel.style.top = newTop + 'px';
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        document.body.style.userSelect = '';
      }
    });

    const btnMin = document.getElementById('btnMinEdit');
    const btnMax = document.getElementById('btnMaxEdit');
    const bodyEl = document.getElementById('editPanelBody');
    const footerEl = document.getElementById('editPanelFooter');

    btnMin.addEventListener('click', () => {
      isEditMinimized = !isEditMinimized;
      if (isEditMinimized) {
        bodyEl.classList.add('hidden');
        footerEl.classList.add('hidden');
        panel.style.height = 'auto';
        panel.style.resize = 'none';
        btnMin.textContent = '🗖';
        btnMin.title = '展開內容';
      } else {
        bodyEl.classList.remove('hidden');
        footerEl.classList.remove('hidden');
        panel.style.resize = 'both';
        btnMin.textContent = '🗕';
        btnMin.title = '縮小內容';
      }
    });

    btnMax.addEventListener('click', () => {
      if (isEditMinimized) {
        btnMin.click();
      }
      isEditMaximized = !isEditMaximized;
      if (isEditMaximized) {
        panel.style.width = '540px';
        bodyEl.style.maxHeight = '84vh';
        btnMax.textContent = '🗗';
        btnMax.title = '還原預設大小';
      } else {
        panel.style.width = '360px';
        panel.style.height = 'auto';
        bodyEl.style.maxHeight = '75vh';
        btnMax.textContent = '🗖';
        btnMax.title = '放大視窗';
      }
    });
  }

  window.togglePopupSize = function(btn) {
    const container = btn.closest('.resizable-popup');
    if (!container) return;
    if (container.dataset.expanded === 'true') {
      container.style.width = '220px';
      container.style.fontSize = '12px';
      container.dataset.expanded = 'false';
      btn.textContent = '🔍 放大';
    } else {
      container.style.width = '360px';
      container.style.fontSize = '14px';
      container.dataset.expanded = 'true';
      btn.textContent = '🔍 縮小';
    }
  };

  // ======================= 輔助函式：計算距離與爬升 =======================
  function calculateTrackStats(geojson) {
    let totalDist = 0; 
    let totalAscent = 0; 
    let lastLat = null, lastLon = null, lastEle = null;

    if (!geojson || !geojson.features) return { distance: '0.00', elevation: '0' };

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    geojson.features.forEach(f => {
      if (!f.geometry || !f.geometry.coordinates) return;
      const coords = f.geometry.coordinates;
      const type = f.geometry.type;

      let points = [];
      if (type === 'LineString') {
        points = coords;
      } else if (type === 'MultiLineString' || type === 'Polygon') {
        coords.forEach(sub => sub.forEach(p => points.push(p)));
      } else if (type === 'Point') {
        points = [coords];
      }

      points.forEach(p => {
        const lon = p[0];
        const lat = p[1];
        const ele = p.length > 2 ? Number(p[2]) : null;

        if (lastLat !== null && lastLon !== null) {
          totalDist += getDistance(lastLat, lastLon, lat, lon);
        }
        if (lastEle !== null && ele !== null) {
          const diff = ele - lastEle;
          if (diff > 0) totalAscent += diff;
        }

        lastLat = lat;
        lastLon = lon;
        if (ele !== null) lastEle = ele;
      });
    });

    return {
      distance: totalDist.toFixed(2),
      elevation: Math.round(totalAscent)
    };
  }

  function formatLocalDateTime(dateObj) {
    const pad = n => String(n).padStart(2, '0');
    const date = `${dateObj.getFullYear()}-${pad(dateObj.getMonth() + 1)}-${pad(dateObj.getDate())}`;
    return { date };
  }

  function getFirstCoordFromGeoJSON(geojson) {
    if (!geojson || !geojson.features) return null;
    for (const f of geojson.features) {
      if (!f.geometry || !f.geometry.coordinates) continue;
      const coords = f.geometry.coordinates;
      const type = f.geometry.type;
      if (type === 'Point' && coords.length >= 2) {
        return { lng: coords[0], lat: coords[1] };
      } else if ((type === 'LineString' || type === 'MultiPoint') && coords.length > 0 && coords[0].length >= 2) {
        return { lng: coords[0][0], lat: coords[0][1] };
      } else if ((type === 'MultiLineString' || type === 'Polygon') && coords.length > 0 && coords[0].length > 0 && coords[0][0].length >= 2) {
        return { lng: coords[0][0][0], lat: coords[0][0][1] };
      }
    }
    return null;
  }

  function enqueueReverseGeocode(track, lat, lng) {
    geocodeQueue.push({ track, lat, lng });
    if (!isGeocoding) processGeocodeQueue();
  }

  async function processGeocodeQueue() {
    if (geocodeQueue.length === 0) {
      isGeocoding = false;
      return;
    }
    isGeocoding = true;
    const { track, lat, lng } = geocodeQueue.shift();

    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=14&accept-language=zh-TW`);
      if (res.ok) {
        const data = await res.json();
        const addr = data.address || {};
        const city = addr.city || addr.county || addr.state || '';
        const dist = addr.town || addr.suburb || addr.district || addr.village || '';
        const poi = addr.peak || addr.mountain || addr.tourism || addr.park || addr.nature_reserve || addr.road || '';
        const autoLoc = [city, dist, poi].filter(Boolean).join(' ');

        if (autoLoc) {
          if (!track.location) {
            track.location = autoLoc;
          } else if (!track.location.includes(city) && city) {
            track.location = `${city}${dist ? dist + ' ' : ''}${track.location}`;
          }
          applyFiltersAndRender();
          if (selectedTrackId === track.id) {
            document.getElementById('editLocation').value = track.location;
          }
          saveMetadataToStorage();
        }
      }
    } catch (e) {
      console.warn('自動查詢座標地點略過:', e);
    }

    setTimeout(processGeocodeQueue, 1100);
  }

  // ======================= 依檔名自動擷取分類 =======================
  function extractCategoryFromFilename(fileName) {
    const nameLower = fileName.toLowerCase();
    if (nameLower.includes('主題') || nameLower.includes('專題')) return '主題地圖';
    if (nameLower.includes('台灣') || nameLower.includes('國內') || nameLower.includes('爬山') || nameLower.includes('健行')) return '台灣旅遊地圖';
    if (nameLower.includes('出國') || nameLower.includes('國外') || nameLower.includes('日本') || nameLower.includes('歐洲') || nameLower.includes('中國')) return '出國旅遊地圖';
    if (nameLower.includes('參考') || nameLower.includes('軌跡參考')) return '參考地圖';
    if (nameLower.includes('生活') || nameLower.includes('日常') || nameLower.includes('市區')) return '生活地圖';
    return ''; // 若無則回傳空，代表無需顯示
  }

  // ======================= 檔案解析核心 (優先順序 2->3) =======================
  async function parseTrackFile(file) {
    const ext = '.' + file.name.split('.').pop().toLowerCase();
    let xmlText = '';

    if (ext === '.kmz') {
      const zip = await JSZip.loadAsync(file);
      const kmlFile = Object.values(zip.files).find(f => f.name.toLowerCase().endsWith('.kml'));
      if (!kmlFile) throw new Error('KMZ 壓縮檔內找不到 KML 檔案');
      xmlText = await kmlFile.async('string');
    } else {
      xmlText = await file.text();
    }

    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
    let geojson;

    if (ext === '.gpx') {
      geojson = toGeoJSON.gpx(xmlDoc);
    } else {
      geojson = toGeoJSON.kml(xmlDoc);
    }

    let extractedDate = '';

    // 【優先順序 1】：檔案內部 XML 時間標籤
    const timeNodes = xmlDoc.querySelectorAll('trkpt time, wpt time, metadata time, time, when, TimeStamp when');
    for (const node of timeNodes) {
      if (node && node.textContent) {
        const d = new Date(node.textContent.trim());
        if (!isNaN(d.getTime())) {
          const dt = formatLocalDateTime(d);
          extractedDate = dt.date;
          break;
        }
      }
    }

    // 【優先順序 2】：從檔案名稱解析日期 (支援 8 碼如 20121201)
    if (!extractedDate) {
      const match8 = file.name.match(/(20\d{2})(\d{2})(\d{2})/) || file.name.match(/(19\d{2})(\d{2})(\d{2})/);
      const matchStandard = file.name.match(/(20\d{2})[-_./]?(\d{2})[-_./]?(\d{2})/);
      
      if (match8) {
        extractedDate = `${match8[1]}-${match8[2]}-${match8[3]}`;
      } else if (matchStandard) {
        extractedDate = `${matchStandard[1]}-${matchStandard[2]}-${matchStandard[3]}`;
      }
    }

    let extractedLocation = '';
    const locCandidates = [
      xmlDoc.querySelector('Document > name'),
      xmlDoc.querySelector('Folder > name'),
      xmlDoc.querySelector('trk > name'),
      xmlDoc.querySelector('rte > name'),
      xmlDoc.querySelector('metadata > name'),
      xmlDoc.querySelector('Placemark > address'),
      xmlDoc.querySelector('Placemark > name'),
      xmlDoc.querySelector('wpt > name')
    ];

    const baseFileName = file.name.replace(/\.(kml|kmz|gpx)$/i, '');
    for (const node of locCandidates) {
      if (node && node.textContent) {
        const text = node.textContent.trim();
        if (text && !/^(track|route|untitled|path|way|line|\d+)$/i.test(text) && text !== file.name) {
          extractedLocation = text;
          break;
        }
      }
    }

    if (!extractedLocation && geojson && geojson.features) {
      for (const f of geojson.features) {
        const pName = (f.properties?.name || f.properties?.address || '').trim();
        if (pName && !/^(track|route|untitled|path|\d+)$/i.test(pName)) {
          extractedLocation = pName;
          break;
        }
      }
    }

    if (!extractedLocation) {
      const cleanedName = baseFileName.replace(/(20\d{2})[-_./]?(\d{2})[-_./]?(\d{2})([T\s_-]?\d{2}[-_:]?\d{2}([-_:]?\d{2})?)?/g, '').replace(/^[-_\s]+|[-_\s]+$/g, '');
      if (cleanedName) extractedLocation = cleanedName;
    }

    let extractedAuthor = '';
    const authorNode = xmlDoc.querySelector('author > name') || xmlDoc.querySelector('author') || xmlDoc.querySelector('metadata > author') || xmlDoc.querySelector('email');
    if (authorNode && authorNode.textContent) {
      extractedAuthor = authorNode.textContent.trim();
    }

    let extractedLink = '';
    const linkNode = xmlDoc.querySelector('link') || xmlDoc.querySelector('metadata > link');
    if (linkNode) {
      extractedLink = linkNode.getAttribute('href') || linkNode.textContent.trim();
    }

    const stats = calculateTrackStats(geojson);
    const firstCoord = getFirstCoordFromGeoJSON(geojson);

    return {
      geojson,
      extractedDate,
      extractedLocation,
      extractedAuthor,
      extractedLink,
      distance: stats.distance,
      elevation: stats.elevation,
      firstCoord,
      rawContent: ext === '.kmz' ? await file.arrayBuffer() : xmlText,
      rawXmlString: ext === '.kmz' ? '' : xmlText
    };
  }

  async function loadTracksFromDirectory() {
    tracks.forEach(t => { if (t.layerGroup) map.removeLayer(t.layerGroup); });
    tracks = [];
    selectedTrackId = null;
    selectedForDeleteIds.clear();
    document.getElementById('editPanel').classList.add('hidden');

    let folderMeta = {};
    try {
      const metaHandle = await directoryHandle.getFileHandle(METADATA_FILENAME);
      const metaFile = await metaHandle.getFile();
      folderMeta = JSON.parse(await metaFile.text());
    } catch (e) {}

    for await (const [name, handle] of directoryHandle.entries()) {
      if (handle.kind === 'file' && /\.(kml|kmz|gpx)$/i.test(name)) {
        const file = await handle.getFile();
        await addFileToSystem(file, handle, folderMeta[name]);
      }
    }

    updateYearFilterOptions();
    applyFiltersAndRender();
    fitAllVisibleTracks();
    saveMetadataToStorage();
  }

  async function addFileToSystem(file, fileHandle, savedMeta = {}) {
    try {
      const parsed = await parseTrackFile(file);
      const lastDotIndex = file.name.lastIndexOf('.');
      const baseName = lastDotIndex !== -1 ? file.name.substring(0, lastDotIndex) : file.name;
      const ext = lastDotIndex !== -1 ? file.name.substring(lastDotIndex) : '';

      const color = savedMeta?.color || DEFAULT_COLORS[tracks.length % DEFAULT_COLORS.length];
      
      // 分類：若有已存檔分類則用存檔的，否則依據檔名自動擷取
      const autoCategory = extractCategoryFromFilename(file.name);
      const trackCategory = savedMeta?.category !== undefined ? savedMeta.category : autoCategory;

      const trackObj = {
        id: 'trk_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        fileName: file.name,
        baseName: baseName,
        ext: ext,
        fileHandle: fileHandle,
        rawContent: parsed.rawContent,
        rawXmlString: parsed.rawXmlString,
        geojson: parsed.geojson,
        category: trackCategory,
        date: parsed.extractedDate || savedMeta?.date || '',
        location: savedMeta?.location || parsed.extractedLocation || '',
        notes: savedMeta?.notes || '',
        author: savedMeta?.author || parsed.extractedAuthor || '',
        link: savedMeta?.link || parsed.extractedLink || '',
        distance: parsed.distance || '0.00',
        elevation: parsed.elevation || '0',
        color: color,
        weight: savedMeta?.weight || 4,
        visible: savedMeta?.visible !== undefined ? savedMeta.visible : true,
        waypoints: savedMeta?.waypoints || [],
        layerGroup: null
      };

      tracks.push(trackObj);
      renderMapLayers(trackObj);

      if (!savedMeta?.location && parsed.firstCoord) {
        enqueueReverseGeocode(trackObj, parsed.firstCoord.lat, parsed.firstCoord.lng);
      }
    } catch (err) {
      console.error(`解析檔案 ${file.name} 失敗:`, err);
    }
  }

  // ======================= 地圖組合 (合併多個路徑檔案) =======================
  document.getElementById('btnMergeTracks').addEventListener('click', async () => {
    const selectedTracks = tracks.filter(t => selectedForDeleteIds.has(t.id));
    if (selectedTracks.length < 2) {
      alert('請至少勾選 2 個以上要組合的地圖檔案！');
      return;
    }

    const newMergedName = prompt('請輸入組合後的新地圖檔案名稱：', 'Merged_Track_Map');
    if (!newMergedName) return;

    let gpxTracksXml = '';
    selectedTracks.forEach(t => {
      if (t.geojson && t.geojson.features) {
        t.geojson.features.forEach(f => {
          if (f.geometry && f.geometry.type === 'LineString') {
            gpxTracksXml += `  <trk>\n    <name>${escapeHtml(t.fileName)}</name>\n    <trkseg>\n`;
            f.geometry.coordinates.forEach(coord => {
              const lon = coord[0];
              const lat = coord[1];
              const ele = coord.length > 2 ? `<ele>${coord[2]}</ele>` : '';
              gpxTracksXml += `      <trkpt lat="${lat}" lon="${lon}">${ele}</trkpt>\n`;
            });
            gpxTracksXml += `    </trkseg>\n  </trk>\n`;
          }
        });
      }
    });

    const combinedGpxContent = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.0" creator="Trail Manager - https://github.com" xmlns="http://www.topografix.com/GPX/1/0">
  <metadata>
    <name>${escapeHtml(newMergedName)}</name>
    <desc>由 ${selectedTracks.length} 個地圖檔案組合而成</desc>
    <time>${new Date().toISOString()}</time>
  </metadata>
${gpxTracksXml}</gpx>`;

    const blob = new Blob([combinedGpxContent], { type: 'application/gpx+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${newMergedName}.gpx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    const newFile = new File([blob], `${newMergedName}.gpx`, { type: 'application/gpx+xml' });
    const savedMeta = JSON.parse(localStorage.getItem('tracks_meta_fallback') || '{}');
    await addFileToSystem(newFile, null, savedMeta[newFile.name]);
    updateYearFilterOptions();
    applyFiltersAndRender();
    fitAllVisibleTracks();
    saveMetadataToStorage();

    alert(`成功將 ${selectedTracks.length} 個地圖檔案組合為「${newMergedName}.gpx」並已自動匯入下載！`);
  });

  // ======================= 繪製地圖路徑與點擊互動 =======================
  function renderMapLayers(track) {
    if (track.layerGroup) {
      map.removeLayer(track.layerGroup);
    }

    const layerGroup = L.featureGroup();

    const geoLayer = L.geoJSON(track.geojson, {
      style: () => ({
        color: track.color,
        weight: Number(track.weight),
        opacity: 0.85
      }),
      pointToLayer: (feature, latlng) => {
        return L.circleMarker(latlng, {
          radius: 6,
          fillColor: track.color,
          color: '#ffffff',
          weight: 2,
          fillOpacity: 1
        });
      },
      onEachFeature: (feature, layer) => {
        layer.on('click', (e) => {
          L.DomEvent.stopPropagation(e);
          selectTrack(track.id, false);
          layer.openPopup(e.latlng);
        });
        
        layer.on('mouseover', () => {
          if (layer.setStyle) layer.setStyle({ weight: Number(track.weight) + 3, opacity: 1 });
        });
        layer.on('mouseout', () => {
          if (layer.setStyle) layer.setStyle({ weight: Number(track.weight), opacity: 0.85 });
        });
      }
    });

    geoLayer.bindPopup(() => createTrackPopupHTML(track), { maxWidth: 500 });
    layerGroup.addLayer(geoLayer);

    track.waypoints.forEach(wp => {
      const marker = L.marker([wp.lat, wp.lng]);
      marker.bindPopup(`
        <div class="text-xs space-y-1">
          <div class="font-bold text-sm text-slate-800">📍 ${escapeHtml(wp.name)}</div>
          ${wp.desc ? `<div class="text-slate-600">${escapeHtml(wp.desc)}</div>` : ''}
          <div class="text-[10px] text-slate-400">所屬檔案：${escapeHtml(track.fileName)}</div>
        </div>
      `);
      marker.on('click', () => selectTrack(track.id, false));
      layerGroup.addLayer(marker);
    });

    track.layerGroup = layerGroup;
    if (track.visible) {
      layerGroup.addTo(map);
    }
  }

  function createTrackPopupHTML(track) {

      <div class="resizable-popup text-xs space-y-1.5 pr-1">

          <div class="font-bold text-sm text-blue-700 truncate">${escapeHtml(track.fileName)}</div>
          <button type="button" onclick="togglePopupSize(this)" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded border border-slate-300 shrink-0">🔍 放大</button>
        </div>
        ${track.category ? `<div><span class="font-semibold text-slate-600">分類：</span><span class="bg-slate-100 px-1.5 py-0.5 rounded font-medium">${escapeHtml(track.category)}</span></div>` : ''}
        ${track.date ? `<div><span class="font-semibold text-slate-600">日期：</span>${track.date}</div>` : ''}

        ${track.link ? `<div><span class="font-semibold text-slate-600">連結：</span><a href="${escapeHtml(track.link)}" target="_blank" class="text-blue-600 underline break-all">${escapeHtml(track.link)}</a></div>` : ''}
      </div>

  // ======================= 左側清單渲染與篩選邏輯 =======================
  function updateYearFilterOptions() {
    const years = new Set();
    tracks.forEach(t => {
      if (t.date && t.date.length >= 4) years.add(t.date.substring(0, 4));
    });
    const sortedYears = Array.from(years).sort((a, b) => b.localeCompare(a));
    const select = document.getElementById('filterYear');
    const currentVal = select.value;
    select.innerHTML = '<option value="">所有年份</option>' + 
      sortedYears.map(y => `<option value="${y}">${y} 年</option>`).join('');
    select.value = currentVal;
  }

  function getFilteredTracks() {
    const category = document.getElementById('filterCategory').value;
    const year = document.getElementById('filterYear').value;
    const kw = document.getElementById('filterLocation').value.trim().toLowerCase();

    const presetCategories = ['主題地圖', '台灣旅遊地圖', '出國旅遊地圖', '參考地圖', '生活地圖'];

    return tracks.filter(t => {
      if (category) {
        if (category === '其他自訂分類') {
          if (presetCategories.includes(t.category) || !t.category) return false;
        } else if (t.category !== category) {
          return false;
        }
      }
      if (year && (!t.date || !t.date.startsWith(year))) return false;
      if (kw) {
        // 支援 8 碼日期直接轉換比對（例如輸入 20121201 會轉成 2012-12-01 進行檔名與日期比對）
        let searchKw = kw;
        if (/^\d{8}$/.test(kw)) {
          searchKw = `${kw.substring(0,4)}-${kw.substring(4,6)}-${kw.substring(6,8)}`;
        }
        const matchName = t.fileName.toLowerCase().includes(searchKw);
        const matchDate = t.date && t.date.includes(searchKw);
        if (!matchName && !matchDate) return false;
      }
      return true;
    }).sort((a, b) => {
      const dtA = `${a.date || ''}`;
      const dtB = `${b.date || ''}`;
      return dtB.localeCompare(dtA);
    });
  }

  function applyFiltersAndRender() {
    const filtered = getFilteredTracks();
    const filteredIds = new Set(filtered.map(t => t.id));
    const listEl = document.getElementById('trackList');
    document.getElementById('trackCount').textContent = `顯示 ${filtered.length} / 共 ${tracks.length} 筆`;

    tracks.forEach(t => {
      if (!t.layerGroup) return;
      if (filteredIds.has(t.id) && t.visible) {
        if (!map.hasLayer(t.layerGroup)) map.addLayer(t.layerGroup);
      } else {
        if (map.hasLayer(t.layerGroup)) map.removeLayer(t.layerGroup);
      }
    });

    updateBatchDeleteUI(filtered);

    if (filtered.length === 0) {
      listEl.innerHTML = `<div class="text-center text-slate-400 mt-8 text-sm">沒有符合篩選條件的路徑檔案</div>`;
      return;
    }

    listEl.innerHTML = filtered.map(t => `
      <div id="card_${t.id}" class="p-2.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 transition shadow-sm cursor-pointer flex items-start gap-2 ${t.id === selectedTrackId ? 'active-track-card' : ''}" onclick="selectTrack('${t.id}', true)">
        <input type="checkbox" ${t.visible ? 'checked' : ''} class="mt-1 rounded text-blue-600 cursor-pointer" onclick="toggleTrackVisibility(event, '${t.id}')" title="勾選是否顯示在地圖上">
        <span class="w-3 h-3 rounded-full mt-1 shrink-0 border border-black/10" style="background-color: ${t.color}"></span>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between gap-1">
            <div class="font-bold text-xs text-slate-800 truncate">${escapeHtml(t.fileName)}</div>
            ${t.category ? `<span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded shrink-0 font-medium">${escapeHtml(t.category)}</span>` : ''}
          </div>
          <div class="flex flex-wrap items-center gap-1 text-[11px] text-slate-500 mt-1">
            ${t.date ? `<span>📅 ${t.date}</span>` : ''}
            ${t.location ? `<span class="bg-slate-100 px-1 py-0.5 rounded text-slate-700 truncate max-w-[110px]">📍 ${escapeHtml(t.location)}</span>` : ''}
            <span class="bg-blue-50 text-blue-700 px-1 rounded font-semibold">📏 ${t.distance}km / ⛰️ ${t.elevation}m</span>
          </div>
        </div>
        <label class="flex items-center gap-1 text-[11px] text-red-600 hover:bg-red-50 px-1 py-0.5 rounded border border-transparent hover:border-red-200 cursor-pointer shrink-0" onclick="event.stopPropagation();" title="勾選此檔案進行刪除或組合">
          <input type="checkbox" ${selectedForDeleteIds.has(t.id) ? 'checked' : ''} class="rounded text-red-600 cursor-pointer" onchange="toggleTrackDeleteSelection(event, '${t.id}')">
          <span>選取</span>
        </label>
      </div>
    `).join('');
  }

  window.toggleTrackVisibility = function(e, id) {
    e.stopPropagation();
    const track = tracks.find(t => t.id === id);
    if (!track) return;
    track.visible = e.target.checked;
    applyFiltersAndRender();
    saveMetadataToStorage();
  };

  window.toggleTrackDeleteSelection = function(e, id) {
    e.stopPropagation();
    if (e.target.checked) {
      selectedForDeleteIds.add(id);
    } else {
      selectedForDeleteIds.delete(id);
    }
    updateBatchDeleteUI(getFilteredTracks());
  };

  function updateBatchDeleteUI(filteredTracks) {
    const validIds = new Set(tracks.map(t => t.id));
    for (const id of selectedForDeleteIds) {
      if (!validIds.has(id)) selectedForDeleteIds.delete(id);
    }

    const count = selectedForDeleteIds.size;
    const btnBatchDelete = document.getElementById('btnBatchDelete');
    btnBatchDelete.textContent = `🗑️ 刪除 (${count})`;
    btnBatchDelete.disabled = count === 0;

    const btnMerge = document.getElementById('btnMergeTracks');
    btnMerge.textContent = `🧩 地圖組合 (${count})`;
    btnMerge.disabled = count < 2;

    const toggleAllDel = document.getElementById('toggleAllDeleteSelect');
    if (filteredTracks && filteredTracks.length > 0) {
      toggleAllDel.checked = filteredTracks.every(t => selectedForDeleteIds.has(t.id));
    } else {
      toggleAllDel.checked = false;
    }
  }

  document.getElementById('toggleAllDeleteSelect').addEventListener('change', (e) => {
    const checked = e.target.checked;
    const filtered = getFilteredTracks();
    filtered.forEach(t => {
      if (checked) selectedForDeleteIds.add(t.id);
      else selectedForDeleteIds.delete(t.id);
    });
    applyFiltersAndRender();
  });

  document.getElementById('btnBatchDelete').addEventListener('click', async () => {
    const toDelete = tracks.filter(t => selectedForDeleteIds.has(t.id));
    if (toDelete.length === 0) return;

    const names = toDelete.map(t => `• ${t.fileName}`).join('\n');
    const msg = directoryHandle
      ? `確定要刪除勾選的 ${toDelete.length} 個檔案嗎？\n⚠️ 注意：這將會同步從您的電腦檔案管理員（硬碟）中永久刪除此檔案：\n\n${names}`
      : `確定要從清單中刪除勾選的 ${toDelete.length} 個檔案嗎？\n\n${names}`;

    if (!confirm(msg)) return;

    for (const track of toDelete) {
      if (directoryHandle && track.fileHandle) {
        try {
          await directoryHandle.removeEntry(track.fileName);
        } catch (err) {
          alert(`從硬碟刪除「${track.fileName}」失敗：` + err.message);
          continue;
        }
      }
      if (track.layerGroup) map.removeLayer(track.layerGroup);
      tracks = tracks.filter(t => t.id !== track.id);
      selectedForDeleteIds.delete(track.id);
      if (selectedTrackId === track.id) {
        selectedTrackId = null;
        document.getElementById('editPanel').classList.add('hidden');
      }
    }

    updateYearFilterOptions();
    applyFiltersAndRender();
    await saveMetadataToStorage();
  });

  document.getElementById('toggleAllVisible').addEventListener('change', (e) => {
    const checked = e.target.checked;
    const filtered = getFilteredTracks();
    filtered.forEach(t => t.visible = checked);
    applyFiltersAndRender();
    saveMetadataToStorage();
  });

  ['filterCategory', 'filterYear', 'filterLocation'].forEach(id => {
    document.getElementById(id).addEventListener('input', applyFiltersAndRender);
  });

  document.getElementById('btnResetFilter').addEventListener('click', () => {
    document.getElementById('filterCategory').value = '';
    document.getElementById('filterYear').value = '';
    document.getElementById('filterLocation').value = '';
    applyFiltersAndRender();
  });

  // ======================= 選取與編輯路徑資訊 =======================
  window.selectTrack = function(id, zoomTo = false) {
    selectedTrackId = id;
    const track = tracks.find(t => t.id === id);
    if (!track) return;

    document.querySelectorAll('[id^="card_"]').forEach(el => el.classList.remove('active-track-card'));
    const cardEl = document.getElementById('card_' + id);
    if (cardEl) {
      cardEl.classList.add('active-track-card');
      cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    document.getElementById('editPanel').classList.remove('hidden');
    document.getElementById('editPanelTitleText').textContent = track.fileName;
    document.getElementById('editFileName').value = track.baseName;
    document.getElementById('editFileExt').textContent = track.ext;
    
    const presetCategories = ['主題地圖', '台灣旅遊地圖', '出國旅遊地圖', '參考地圖', '生活地圖'];
    const catSelect = document.getElementById('editCategorySelect');
    const catCustom = document.getElementById('editCategoryCustom');
    
    if (presetCategories.includes(track.category)) {
      catSelect.value = track.category;
      catCustom.classList.add('hidden');
      catCustom.value = '';
    } else if (track.category) {
      catSelect.value = '其他自訂';
      catCustom.classList.remove('hidden');
      catCustom.value = track.category;
    } else {
      catSelect.value = '台灣旅遊地圖';
      catCustom.classList.add('hidden');
      catCustom.value = '';
    }

    document.getElementById('editDate').value = track.date || '';
    document.getElementById('editLocation').value = track.location;
    document.getElementById('editColor').value = track.color;
    document.getElementById('editColorHex').textContent = track.color.toUpperCase();
    document.getElementById('editWeight').value = track.weight;
    document.getElementById('weightVal').textContent = track.weight;

    document.getElementById('metaDistance').textContent = `${track.distance} km`;
    document.getElementById('metaElevation').textContent = `${track.elevation} m`;

    const authorCont = document.getElementById('metaAuthorContainer');
    const authorEl = document.getElementById('metaAuthor');
    if (track.author) {
      authorEl.textContent = track.author;
      authorCont.classList.remove('hidden');
    } else {
      authorCont.classList.add('hidden');
    }

    const linkCont = document.getElementById('metaLinkContainer');
    const linkEl = document.getElementById('metaLink');
    if (track.link) {
      linkEl.href = track.link;
      linkEl.textContent = track.link;
      linkCont.classList.remove('hidden');
    } else {
      linkCont.classList.add('hidden');
    }

    renderWaypointList(track);

    if (zoomTo && track.layerGroup && track.layerGroup.getBounds().isValid()) {
      map.fitBounds(track.layerGroup.getBounds(), { padding: [50, 50] });
    }
  };

  document.getElementById('editColor').addEventListener('input', (e) => {
    document.getElementById('editColorHex').textContent = e.target.value.toUpperCase();
    const track = tracks.find(t => t.id === selectedTrackId);
    if (track) { track.color = e.target.value; renderMapLayers(track); }
  });

  document.getElementById('editWeight').addEventListener('input', (e) => {
    document.getElementById('weightVal').textContent = e.target.value;
    const track = tracks.find(t => t.id === selectedTrackId);
    if (track) { track.weight = Number(e.target.value); renderMapLayers(track); }
  });

  function renderWaypointList(track) {
    const container = document.getElementById('waypointList');
    if (!track.waypoints || track.waypoints.length === 0) {
      container.innerHTML = `<div class="text-slate-400 text-center py-2">尚無新增標記地點</div>`;
      return;
    }
    container.innerHTML = track.waypoints.map(wp => `
      <div class="flex items-center justify-between bg-slate-50 px-2.5 py-1.5 rounded border border-slate-200">
        <div class="truncate cursor-pointer flex-1" onclick="map.setView([${wp.lat}, ${wp.lng}], 16)">
          <span class="font-semibold text-slate-700">📍 ${escapeHtml(wp.name)}</span>
          ${wp.desc ? `<span class="text-slate-400 ml-1">(${escapeHtml(wp.desc)})</span>` : ''}
        </div>
        <button onclick="deleteWaypoint('${wp.id}')" class="text-red-500 hover:text-red-700 ml-2 font-bold" title="刪除此地點">&times;</button>
      </div>
    `).join('');
  }

  window.deleteWaypoint = function(wpId) {
    const track = tracks.find(t => t.id === selectedTrackId);
    if (!track) return;
    track.waypoints = track.waypoints.filter(w => w.id !== wpId);
    renderMapLayers(track);
    renderWaypointList(track);
    saveMetadataToStorage();
  };

  document.getElementById('btnStartAddWaypoint').addEventListener('click', () => {
    isAddingWaypoint = true;
    document.getElementById('addWaypointBanner').classList.remove('hidden');
    document.getElementById('map').style.cursor = 'crosshair';
  });

  function exitAddWaypointMode() {
    isAddingWaypoint = false;
    document.getElementById('addWaypointBanner').classList.add('hidden');
    document.getElementById('map').style.cursor = '';
  }

  document.getElementById('btnCancelWaypoint').addEventListener('click', exitAddWaypointMode);
  document.getElementById('btnCloseEdit').addEventListener('click', () => {
    document.getElementById('editPanel').classList.add('hidden');
    exitAddWaypointMode();
  });

  document.getElementById('btnZoomToTrack').addEventListener('click', () => {
    const track = tracks.find(t => t.id === selectedTrackId);
    if (track && track.layerGroup && track.layerGroup.getBounds().isValid()) {
      map.fitBounds(track.layerGroup.getBounds(), { padding: [50, 50] });
    }
  });

  // ======================= 儲存修改與同步更改檔名 =======================
  document.getElementById('btnSaveTrack').addEventListener('click', async () => {
    const track = tracks.find(t => t.id === selectedTrackId);
    if (!track) return;

    const newBaseName = document.getElementById('editFileName').value.trim();
    if (!newBaseName) {
      alert('檔案名稱不能為空！');
      return;
    }

    const newFullFileName = newBaseName + track.ext;

    if (newFullFileName !== track.fileName) {
      if (directoryHandle && track.fileHandle) {
        try {
          if ('move' in track.fileHandle) {
            await track.fileHandle.move(newFullFileName);
          } else {
            const newHandle = await directoryHandle.getFileHandle(newFullFileName, { create: true });
            const writable = await newHandle.createWritable();
            await writable.write(track.rawContent);
            await writable.close();
            await directoryHandle.removeEntry(track.fileName);
            track.fileHandle = newHandle;
          }
        } catch (err) {
          alert('同步修改檔案管理員內的檔名失敗：' + err.message);
          return;
        }
      }
      track.baseName = newBaseName;
      track.fileName = newFullFileName;
    }

    const selCat = document.getElementById('editCategorySelect').value;
    const customCat = document.getElementById('editCategoryCustom').value.trim();
    track.category = (selCat === 'Other' || selCat === '其他自訂') ? customCat : selCat;

    track.date = document.getElementById('editDate').value;
    track.location = document.getElementById('editLocation').value.trim();
    track.color = document.getElementById('editColor').value;
    track.weight = Number(document.getElementById('editWeight').value);

    document.getElementById('editPanelTitleText').textContent = track.fileName;

    renderMapLayers(track);
    updateYearFilterOptions();
    applyFiltersAndRender();
    await saveMetadataToStorage();

    const btn = document.getElementById('btnSaveTrack');
    const origText = btn.textContent;
    btn.textContent = '✅ 已儲存！';
    setTimeout(() => { btn.textContent = origText; }, 1500);
  });

  // ======================= 刪除路徑並同步從硬碟移除 =======================
  document.getElementById('btnDeleteTrack').addEventListener('click', async () => {
    const track = tracks.find(t => t.id === selectedTrackId);
    if (!track) return;

    const msg = directoryHandle 
      ? `確定要刪除「${track.fileName}」嗎？\n⚠️ 注意：這將會同步從您的電腦檔案管理員（硬碟）中永久刪除此檔案！`
      : `確定要從清單中移除「${track.fileName}」嗎？`;

    if (!confirm(msg)) return;

    if (directoryHandle && track.fileHandle) {
      try {
        await directoryHandle.removeEntry(track.fileName);
      } catch (err) {
        alert('從硬碟刪除檔案失敗：' + err.message);
        return;
      }
    }

    if (track.layerGroup) map.removeLayer(track.layerGroup);
    tracks = tracks.filter(t => t.id !== selectedTrackId);
    selectedForDeleteIds.delete(selectedTrackId);
    selectedTrackId = null;
    document.getElementById('editPanel').classList.add('hidden');

    updateYearFilterOptions();
    applyFiltersAndRender();
    await saveMetadataToStorage();
  });

  // ======================= 儲存設定檔 (_tracks_metadata.json) =======================
  async function saveMetadataToStorage() {
    const metaObj = {};
    tracks.forEach(t => {
      metaObj[t.fileName] = {
        category: t.category,
        date: t.date,
        location: t.location,
        notes: t.notes,
        author: t.author,
        link: t.link,
        distance: t.distance,
        elevation: t.elevation,
        color: t.color,
        weight: t.weight,
        visible: t.visible,
        waypoints: t.waypoints
      };
    });

    if (directoryHandle) {
      try {
        const metaHandle = await directoryHandle.getFileHandle(METADATA_FILENAME, { create: true });
        const writable = await metaHandle.createWritable();
        await writable.write(JSON.stringify(metaObj, null, 2));
        await writable.close();
      } catch (e) {
        console.error('寫入設定檔失敗:', e);
      }
    } else {
      localStorage.setItem('tracks_meta_fallback', JSON.stringify(metaObj));
    }
  }

  function fitAllVisibleTracks() {
    const group = L.featureGroup();
    tracks.forEach(t => {
      if (t.visible && t.layerGroup) group.addLayer(t.layerGroup);
    });
    if (group.getLayers().length > 0 && group.getBounds().isValid()) {
      map.fitBounds(group.getBounds(), { padding: [40, 40] });
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }

  window.addEventListener('load', initMap);
</script>
</body>
</html>
